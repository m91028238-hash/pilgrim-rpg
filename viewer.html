<!DOCTYPE html><html><head><style>body{margin:0}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js?v=3"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import {loadAll} from './js/assets.js';
import {makeHuman, Animator} from './js/human.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping;r.shadowMap.enabled=true;
const s=new THREE.Scene();const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);cam.position.set(0,1.6,5.5);cam.lookAt(0,1,0);

const A=await loadAll(p=>document.title='load '+(p*100|0));
const pm=new THREE.PMREMGenerator(r);s.environment=pm.fromEquirectangular(A.hdr).texture;s.background=new THREE.Color(0x8899aa);
const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(3,5,4);s.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({map:A.tex.grass_d}));ground.rotation.x=-Math.PI/2;s.add(ground);
const list=[{sex:'m',outfit:'Peasant',hair:'Hair_Beard'},{sex:'m',outfit:'Ranger',hair:'Hair_SimpleParted'},{sex:'f',outfit:'Peasant'},{sex:'m',demon:true,outfit:'Ranger'}];
const anims=[];const names=['Walk_Loop','Sword_Regular_A','Idle_Loop','Zombie_Walk_Fwd_Loop'];
list.forEach((o,i)=>{const h=makeHuman(A,o);h.position.x=(i-1.5)*1.3;s.add(h);const an=new Animator(h,A.clips,{a:names[i]});an.play('a');anims.push(an);
 const b=new THREE.Box3().setFromObject(h);console.log('bbox',i,JSON.stringify(b.min),JSON.stringify(b.max));});
// wolf
const w=A.wolf.scene;w.position.set(2.8,0,0);s.add(w);const wm=new THREE.AnimationMixer(w);wm.clipAction(A.wolf.clipMap.Gallop).play();
console.log('wolf bbox',JSON.stringify(new THREE.Box3().setFromObject(w).max));
console.log('boar bbox',JSON.stringify(new THREE.Box3().setFromObject(A.boar.scene).max));
let t=performance.now();window.ready=false;let f=0;
function loop(){requestAnimationFrame(loop);const n=performance.now();const dt=(n-t)/1000;t=n;anims.forEach(a=>a.update(Math.min(dt,.05)));wm.update(Math.min(dt,.05));r.render(s,cam);if(++f>40)window.ready=true;}
loop();
</script></body></html>
