<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<title>The Pilgrim's Way</title>
<link rel="stylesheet" href="style.css?v=8">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js?v=8"}}</script>
<script defer src="https://cloud.umami.is/script.js" data-website-id="15ec783e-8882-42d9-b43b-fefd064bbe24"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div class="lt">The Pilgrim's Way</div><div class="lbar"><i id="lfill"></i></div><div id="lpct">0%</div><div id="lnote">Loading the Camino…</div></div>
<div id="title" class="hidden">
  <div class="tbox">
    <h1>The Pilgrim's Way</h1>
    <div class="sub">A walk to Santiago</div>
    <button id="bContinue" class="tb hidden">Continue</button>
    <button id="bNew" class="tb">New pilgrimage</button>
    <div class="trow"><span>Quality</span><div id="qsel" class="seg"><b data-q="0">Low</b><b data-q="1">Medium</b><b data-q="2">High</b></div></div>
    <button id="bCredits" class="tl">Credits</button>
  </div>
</div>
<div id="hud" class="hidden">
  <div id="bars">
    <div class="lv"><b id="lvl">1</b></div><div id="ownerBadge" class="hidden">OWNER</div>
    <div class="bw"><div class="bar hp"><i id="hpF"></i><span id="hpT"></span></div><div class="bar st"><i id="stF"></i></div><div class="bar fa"><i id="faF"></i></div><div class="bar xp"><i id="xpF"></i></div></div>
  </div>
  <div id="tracker"><div id="trName"></div><div id="trObj"></div><div id="trDist"></div><div id="trNext"></div></div>
  <button id="menuBtn" aria-label="Menu">☰</button>
  <div id="mmWrap"><canvas id="minimap" width="208" height="208"></canvas><div id="clock"></div></div>
  <div id="lockFrame" class="hidden"><div id="lfName"></div><div class="bar ehp"><i id="lfHp"></i></div></div>
  <div id="toasts"></div>
  <div id="prompt" class="hidden"></div>
  <div id="beacon" class="hidden"><i></i><span></span></div>
  <div id="edgeArrow" class="hidden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h12M11 6l7 6-7 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span></div>
  <div id="plates"></div>
  <div id="joyZone"></div><div id="joyBase"><div id="joyKnob"></div></div>
  <div id="actions">
    <button id="aAtk" class="ab big cmb" aria-label="Attack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5 20.5 3.5 20.5 9.5 10 20 7.5 20 7.5 17.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M5 15.5 8.5 19M3.5 20.5l2.5-2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Attack</span></button>
    <button id="aHeavy" class="ab cmb" aria-label="Heavy attack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5c0-2.5 3-4.5 7-4.5s7 2 7 4.5c0 1-1 1.5-2 1.5H7c-1 0-2-.5-2-1.5Z" fill="currentColor"/><path d="M12 10v10.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>Heavy</span></button>
    <button id="aBlock" class="ab cmb" aria-label="Block"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19.5 5.5V11c0 4.8-3.2 8.3-7.5 10-4.3-1.7-7.5-5.2-7.5-10V5.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6.5v11M8 10h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Block</span></button>
    <button id="aRoll" class="ab cmb" aria-label="Dodge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17c3-7 9-10 16-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 4l4 3-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".6"/></svg><span>Dodge</span></button>
    <button id="aLock" class="ab sm cmb" aria-label="Lock on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Lock</span></button>
    <button id="aPray" class="ab sm cmb" aria-label="Pray"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v19M6.5 8h11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>Pray</span></button>
    <button id="aUse" class="ab use hidden" aria-label="Interact"><i id="aUseI"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9.5l4.5 4.5V20H5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="14.5" cy="13" r="1.3" fill="currentColor"/></svg></i><span id="aUseL">Use</span></button>
  </div>
  <div id="moveBtns"><button id="bWalk" class="mv" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4.5" r="2" fill="currentColor"/><path d="M12 8l-2 6 3 3v4M10 14l-2 7M12 8l3 3 3 1M11 9l-3 2-1 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Walk</span></button><button id="bSprint" class="mv" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 5 13h6l-1 9 8-11h-6Z" fill="currentColor"/></svg><span>Sprint</span></button></div>
  <div id="quick"><button class="qs" data-i="0"></button><button class="qs" data-i="1"></button></div>
  <div id="keys" class="hidden">WASD move · Shift sprint · Z walk · LMB attack · RMB block · F heavy · Space dodge · R pray · T lock · E use / enter · Tab menu</div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<div id="dialog" class="hidden"><div id="dName"></div><div id="dText"></div><div id="dChoices"></div></div>
<div id="panel" class="hidden"><div class="ptabs" id="ptabs"></div><button id="pClose" aria-label="Close">✕</button><div id="pBody"></div></div>
<div id="fps" class="hidden"></div>
<script type="module" src="js/game.js?v=8"></script>
</body>
</html>
